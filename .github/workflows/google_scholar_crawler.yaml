name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: google_scholar_crawler/requirements.txt
    - name: Install dependencies
      run: python -m pip install -r google_scholar_crawler/requirements.txt
    - name: Fetch citation data
      working-directory: google_scholar_crawler
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      run: |
        if [ -z "$GOOGLE_SCHOLAR_ID" ]; then
          echo "::error::Set the GOOGLE_SCHOLAR_ID repository secret before running this workflow."
          exit 1
        fi
        python main.py
    - name: Publish citation data
      working-directory: google_scholar_crawler/results
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        remote_repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
